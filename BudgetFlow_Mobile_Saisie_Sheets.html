<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BudgetFlow Mobile</title>
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe3ef;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(135deg,#eef3fb,#f8fafc);color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{margin:0;font-size:26px;letter-spacing:-.04em}.pill{font-size:12px;background:#dbeafe;color:#1e40af;border-radius:999px;padding:7px 10px;font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 16px 40px rgba(15,23,42,.09);margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);font-weight:850;margin:0 0 6px}.field{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{margin-bottom:12px}
.btn{width:100%;border:0;border-radius:16px;padding:14px 16px;font-weight:900;color:#fff;background:var(--blue);font-size:16px}.btn.green{background:var(--green)}.btn.ghost{background:#e8eef8;color:#0f172a}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;font-weight:850}
.status{font-size:13px;padding:12px;border-radius:14px;margin-top:12px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.info{background:#dbeafe;color:#1e40af}
.small{font-size:12px;color:var(--muted);line-height:1.45}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>BudgetFlow</h1>
    <span class="pill">Mobile</span>
  </div>

  <div class="card">
    <label>URL Apps Script /exec</label>
    <input id="apiUrl" class="field" placeholder="Colle l’URL ici">
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="saveUrl()">Sauvegarder URL</button>
    <div id="connStatus" class="status info">Colle l’URL Apps Script une seule fois.</div>
  </div>

  <div class="card">
    <div class="quick">
      <button onclick="setType('depense')">💸 Dépense</button>
      <button onclick="setType('revenu')">💰 Revenu</button>
      <button onclick="setType('remboursement_secu')">🏥 Sécu</button>
      <button onclick="setType('remboursement_mutuelle')">🛡️ Mutuelle</button>
      <button onclick="setType('virement_tiers')">👤 Virement tiers</button>
      <button onclick="setType('epargne')">🐷 Épargne</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="full"><label>Date</label><input id="date" class="field" type="date"></div>
      <div class="full"><label>Type</label><select id="type" class="field"><option value="depense">Dépense</option><option value="revenu">Revenu</option><option value="remboursement_secu">Remboursement Sécu</option><option value="remboursement_mutuelle">Remboursement Mutuelle</option><option value="virement_tiers">Virement d’un tiers</option><option value="epargne">Épargne</option><option value="transfert">Transfert</option></select></div>
    </div>
    <div class="row">
      <div class="full"><label>Montant</label><input id="amount" class="field" type="number" step="0.01" placeholder="30"></div>
      <div class="full"><label>Catégorie</label><input id="category" class="field" list="cats" placeholder="Courses"><datalist id="cats"><option>Courses</option><option>Essence</option><option>Restaurant</option><option>Santé</option><option>Salaire</option><option>Sécu</option><option>Mutuelle</option><option>Virement tiers</option><option>Épargne</option><option>Autre</option></datalist></div>
    </div>
    <div class="full"><label>Compte source</label><input id="accountFrom" class="field" value="Compte courant"></div>
    <div class="full"><label>Compte destination</label><input id="accountTo" class="field" placeholder="Livret A, LDDS..."></div>
    <div class="full"><label>Note</label><input id="note" class="field" placeholder="Note facultative"></div>
    <button class="btn green" onclick="sendTransaction()">Enregistrer dans Google Sheets</button>
    <div id="result" class="status info">Prêt.</div>
  </div>

  <p class="small">Cette appli mobile envoie les données au Google Sheet via Apps Script. Le dashboard PC relit ensuite les données du même Sheet.</p>
</div>

<script>
const URL_KEY='budgetflow_mobile_api';
date.value=new Date().toISOString().slice(0,10);
apiUrl.value=localStorage.getItem(URL_KEY)||'';
function saveUrl(){localStorage.setItem(URL_KEY,apiUrl.value.trim());connStatus.className='status ok';connStatus.textContent='URL sauvegardée.'}
function setType(t){type.value=t;if(t==='remboursement_secu')category.value='Sécu';if(t==='remboursement_mutuelle')category.value='Mutuelle';if(t==='virement_tiers')category.value='Virement tiers';if(t==='epargne')category.value='Épargne'}
async function sendTransaction(){
 const url=(apiUrl.value||localStorage.getItem(URL_KEY)||'').trim();
 if(!url){result.className='status err';result.textContent='URL Apps Script manquante.';return}
 if(!amount.value || Number(amount.value)<=0){result.className='status err';result.textContent='Montant invalide.';return}
 const payload={action:'mobileTransactionOnly',id:crypto.randomUUID(),date:date.value,type:type.value,category:category.value,amount:Number(amount.value),accountFrom:accountFrom.value,accountTo:accountTo.value,note:note.value};
 result.className='status info';result.textContent='Envoi en cours...';
 try{
   await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
   result.className='status ok';result.textContent='Transaction envoyée sans effacer le tableur.';
   amount.value='';note.value='';
 }catch(e){
   result.className='status err';result.textContent='Erreur : '+e.message;
 }
}
</script>
</body>
</html>
