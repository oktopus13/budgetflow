<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BudgetFlow Mobile</title>
<style>
:root{--bg:#eef3fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe3ef;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,system-ui,Arial,sans-serif;background:linear-gradient(135deg,#eef3fb,#f8fafc);color:var(--ink)}
.app{max-width:540px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.top h1{margin:0;font-size:26px;letter-spacing:-.04em}.pill{font-size:12px;background:#dbeafe;color:#1e40af;border-radius:999px;padding:7px 10px;font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 16px 40px rgba(15,23,42,.09);margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);font-weight:850;margin:0 0 6px}.field{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{margin-bottom:12px}
.btn{width:100%;border:0;border-radius:16px;padding:14px 16px;font-weight:900;color:#fff;background:var(--blue);font-size:16px}.btn.green{background:var(--green)}.btn.ghost{background:#e8eef8;color:#0f172a}.btn.red{background:var(--red)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;font-weight:850}.quick button.active{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.status{font-size:13px;padding:12px;border-radius:14px;margin-top:12px}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.info{background:#dbeafe;color:#1e40af}.warn{background:#fef3c7;color:#92400e}.small{font-size:12px;color:var(--muted);line-height:1.45}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>BudgetFlow</h1><span class="pill">Mobile</span></div>

  <div class="card">
    <label>URL Apps Script /exec</label>
    <input id="apiUrl" class="field" placeholder="Colle l’URL ici">
    <div style="height:10px"></div>
    <button class="btn ghost" onclick="saveUrl()">Sauvegarder URL</button>
    <div style="height:8px"></div>
    <button class="btn" onclick="loadAccounts()">Charger les comptes du tableur</button>
    <div id="connStatus" class="status info">Colle l’URL Apps Script puis charge les comptes.</div>
  </div>

  <div class="card">
    <div class="quick">
      <button id="q_depense" onclick="setType('depense')">💸 Dépense</button>
      <button id="q_revenu" onclick="setType('revenu')">💰 Revenu</button>
      <button id="q_remboursement_secu" onclick="setType('remboursement_secu')">🏥 Sécu</button>
      <button id="q_remboursement_mutuelle" onclick="setType('remboursement_mutuelle')">🛡️ Mutuelle</button>
      <button id="q_virement_tiers" onclick="setType('virement_tiers')">👤 Virement tiers</button>
      <button id="q_epargne" onclick="setType('epargne')">🐷 Épargne</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="full"><label>Date</label><input id="date" class="field" type="date"></div>
      <div class="full"><label>Type</label><select id="type" class="field" onchange="syncTypeUi()"><option value="depense">Dépense</option><option value="revenu">Revenu</option><option value="remboursement_secu">Remboursement Sécu</option><option value="remboursement_mutuelle">Remboursement Mutuelle</option><option value="virement_tiers">Virement d’un tiers</option><option value="epargne">Épargne</option><option value="transfert">Transfert</option></select></div>
    </div>
    <div class="row">
      <div class="full"><label>Montant</label><input id="amount" class="field" type="number" step="0.01" placeholder="30"></div>
      <div class="full"><label>Catégorie</label><input id="category" class="field" list="cats" placeholder="Courses"><datalist id="cats"><option>Courses</option><option>Essence</option><option>Restaurant</option><option>Santé</option><option>Salaire</option><option>Sécu</option><option>Mutuelle</option><option>Virement tiers</option><option>Épargne</option><option>Autre</option></datalist></div>
    </div>

    <div class="full"><label id="fromLabel">Compte utilisé</label><select id="accountFrom" class="field"></select></div>
    <div id="toWrap" class="full hidden"><label>Compte destination</label><select id="accountTo" class="field"></select></div>

    <div class="full"><label>Note</label><input id="note" class="field" placeholder="Note facultative"></div>
    <button class="btn green" onclick="sendTransaction()">Enregistrer dans Google Sheets</button>
    <div id="result" class="status info">Prêt.</div>
  </div>

  <p class="small">Cette appli mobile récupère les comptes depuis le tableur, puis envoie uniquement la transaction. Elle n’efface pas les autres données.</p>
</div>

<script>
const URL_KEY='budgetflow_mobile_api';
const ACC_KEY='budgetflow_mobile_accounts_cache';
date.value=new Date().toISOString().slice(0,10);
apiUrl.value=localStorage.getItem(URL_KEY)||'';
let accounts=JSON.parse(localStorage.getItem(ACC_KEY)||'[]');

function setStatus(el,cls,msg){el.className='status '+cls;el.textContent=msg;}
function saveUrl(){localStorage.setItem(URL_KEY,apiUrl.value.trim());setStatus(connStatus,'ok','URL sauvegardée.');}
function accountOptions(){
  if(!accounts.length){
    return '<option value="Compte courant">Compte courant</option><option value="Livret A">Livret A</option><option value="LDDS">LDDS</option>';
  }
  return accounts.map(a=>`<option value="${escapeHtml(a.name)}">${escapeHtml(a.name)}${a.balance!==''&&a.balance!=null?' — '+Number(a.balance).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}):''}</option>`).join('');
}
function renderAccounts(){accountFrom.innerHTML=accountOptions();accountTo.innerHTML=accountOptions();syncTypeUi();}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
async function loadAccounts(){
 const url=(apiUrl.value||localStorage.getItem(URL_KEY)||'').trim();
 if(!url){setStatus(connStatus,'err','URL Apps Script manquante.');return;}
 setStatus(connStatus,'info','Chargement des comptes...');
 try{
   const r=await fetch(url+'?action=getAccounts&ts='+Date.now());
   const j=await r.json();
   if(!j.ok)throw new Error(j.error||'Réponse invalide');
   accounts=j.accounts||[];
   localStorage.setItem(ACC_KEY,JSON.stringify(accounts));
   renderAccounts();
   setStatus(connStatus,'ok',accounts.length+' compte(s) chargé(s) depuis le tableur.');
 }catch(e){
   renderAccounts();
   setStatus(connStatus,'err','Impossible de charger les comptes : '+e.message);
 }
}
function setType(t){type.value=t;if(t==='remboursement_secu')category.value='Sécu';if(t==='remboursement_mutuelle')category.value='Mutuelle';if(t==='virement_tiers')category.value='Virement tiers';if(t==='epargne')category.value='Épargne';syncTypeUi();}
function syncTypeUi(){
 document.querySelectorAll('.quick button').forEach(b=>b.classList.remove('active'));
 const b=document.getElementById('q_'+type.value); if(b)b.classList.add('active');
 const needsTo=(type.value==='epargne'||type.value==='transfert');
 toWrap.classList.toggle('hidden',!needsTo);
 fromLabel.textContent=(type.value==='revenu'||type.value==='remboursement_secu'||type.value==='remboursement_mutuelle'||type.value==='virement_tiers')?'Compte qui reçoit':'Compte utilisé';
}
async function sendTransaction(){
 const url=(apiUrl.value||localStorage.getItem(URL_KEY)||'').trim();
 if(!url){setStatus(result,'err','URL Apps Script manquante.');return;}
 if(!amount.value || Number(amount.value)<=0){setStatus(result,'err','Montant invalide.');return;}
 if((type.value==='epargne'||type.value==='transfert') && accountFrom.value===accountTo.value){setStatus(result,'err','Choisis deux comptes différents.');return;}
 const payload={
   action:'mobileAddTransactionOnly',
   id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),
   date:date.value,
   type:type.value,
   category:category.value||'Autre',
   amount:Number(amount.value),
   accountFrom:accountFrom.value,
   accountTo:(type.value==='epargne'||type.value==='transfert')?accountTo.value:'',
   note:note.value||'',
   source:'mobile'
 };
 setStatus(result,'info','Envoi en cours...');
 try{
   const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
   const text=await r.text();
   let j={}; try{j=JSON.parse(text);}catch{}
   if(j.ok===false)throw new Error(j.error||'Erreur script');
   setStatus(result,'ok','Transaction envoyée sur le bon compte.');
   amount.value='';note.value='';
   await loadAccounts();
 }catch(e){
   setStatus(result,'err','Erreur : '+e.message);
 }
}
renderAccounts();syncTypeUi();
if(apiUrl.value) setTimeout(loadAccounts,400);
</script>
</body>
</html>
